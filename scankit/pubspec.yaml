name: scankit
description: Barcode scanner and generator.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  barcode_widget: ^2.0.4
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#0B6E63"
  adaptive_icon_foreground: assets/icon_fg.png
