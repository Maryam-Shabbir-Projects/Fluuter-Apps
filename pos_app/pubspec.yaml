name: pos_app
description: A Flutter POS (Point of Sale) application
publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  get: ^4.6.5

  # Bluetooth (for printer)
  flutter_blue_plus: ^1.3.5

  # Image picker for product images
  image_picker: ^0.8.7+5

  # For form validation
  form_field_validator: ^1.1.0

  # JSON serialization (optional, if you want)
  json_annotation: ^4.8.0

  # Date & Time utilities
  intl: ^0.18.1

  # For local database or storage (optional)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15

  # Other utilities
  logger: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation for JSON (if used)
  build_runner: ^2.3.3
  json_serializable: ^6.6.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    # Add any images you use in your app here (like profile avatars)

